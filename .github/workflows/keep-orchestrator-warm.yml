name: keep-orchestrator-warm

# Render's free tier puts a service to sleep after ~15 minutes of inactivity.
# The next request then pays a 30-60s cold start — which blows past Kakao's
# ~5s skill timeout, so the customer's message arrives at the backend but the
# reply never reaches their phone ("after one message it stops answering").
#
# This pings /health every 10 minutes so the orchestrator stays warm 24/7 and
# every Kakao reply is computed against a hot instance.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}        # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping orchestrator /health
        run: |
          URL="${ORCHESTRATOR_URL:-https://vip-orchestrator.onrender.com}/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code  ($URL)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          # A non-200 still woke the instance; don't fail the job over a slow
          # cold start — the goal is to keep it warm, not to gate on health.
          echo "::warning::health did not return 200 within retries (instance was still pinged)"
        env:
          ORCHESTRATOR_URL: ${{ vars.ORCHESTRATOR_URL }}
